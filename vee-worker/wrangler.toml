name = "vee-chat-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://vouza.ai"

# Per-IP rate limiting via Durable Object (8 requests per 60s)
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Secrets (set via `wrangler secret put <NAME>`, never stored here):
#   OPENROUTER_API_KEY
#   APP_SHARED_SECRET  — must match the key sent by the frontend as the X-Vee-Key header
